[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "Distributed map matching and route reconstruction"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "networkx==3.5",
  "pyproj==3.7.2",
  "shapely==2.1.2",
  "optuna==4.6.0",
  "joblib==1.5.2",
  "fastapi==0.121.2",
  "uvicorn[standard]==0.38.0",
  "pydantic-settings==2.12.0",
  "folium==0.20.0",
  "matplotlib==3.10.7",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "httpx==0.28.1", "ruff==0.14.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
